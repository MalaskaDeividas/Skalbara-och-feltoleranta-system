apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hotel-service
  template:
    metadata:
      labels:
        app: hotel-service
    spec:
      containers:
      - name: hotel-service
        image: hotel404containerregistry123.azurecr.io/hotel-service:latest  # Use the correct image here
        imagePullPolicy: Always
        ports:
          - containerPort: 8080   # NGINX listens on port 80 (per your Dockerfile)
        resources:
          requests:
            cpu: 126m
            memory: 256Mi
          limits:
            cpu: 256m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hotel-service
spec:
  selector:
    app: hotel-service
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 8080      # External port to reach the service
      targetPort: 8080    # Matches containerPort (NGINX)
